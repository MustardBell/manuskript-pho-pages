name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out compatible Manuskript host
        uses: actions/checkout@v4
        with:
          repository: MustardBell/manuskript
          ref: develop
          path: host

      - name: Check out PHO Pages plugin
        uses: actions/checkout@v4
        with:
          path: host/manuskript/plugins/pho_pages

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r host/requirements.txt pytest pytest-faulthandler
          sudo apt-get -qq update
          sudo apt-get -qq install xvfb libgl1 libxcb-xinerama0 libenchant-2-2

      - name: Run plugin suite
        working-directory: host
        run: >-
          xvfb-run -s '-screen 0 640x480x24 +extension GLX'
          python -B -m pytest -q manuskript/plugins/pho_pages/tests
